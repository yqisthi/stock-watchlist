services:
  postgres:
    image: postgres:17
    container_name: stock-watchlist-db

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${DB_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:latest

    ports:
      - "16686:16686"
      - "4318:4318"

  backend:
    build:
      context: ./service

    container_name: stock-watchlist-backend

    env_file:
      - ./service/.env

    ports:
      - "${BACKEND_PORT}:8080"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
